<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gestion des tâches</title>
    <script src="app.js" defer></script>
</head>
<body>

    <header>
        <h1>TaskFlow</h1>
        <p>Gestionnaire de tâches</p>
    </header>

    <main>
        <section id="auth-warning" hidden>
            <h2>Connexion requise</h2>
            <p>Vous devez être connecté pour accéder à vos tâches.</p>
        </section>

        <section id="application" hidden>
            <section id="formulaire-tache">
                <h2 id="form-title">Ajouter une tâche</h2>

                <form id="task-form">
                    <div>
                        <label for="titre">Titre *</label>
                        <input
                            type="text"
                            id="titre"
                            name="titre"
                            required
                        >
                    </div>

                    <div>
                        <label for="description">Description</label>
                        <textarea
                            id="description"
                            name="description"
                        ></textarea>
                    </div>

                    <div>
                        <label for="priorite">Priorité</label>
                        <select id="priorite" name="priorite">
                            <option value="">Aucune</option>
                            <option value="basse">Basse</option>
                            <option value="moyenne">Moyenne</option>
                            <option value="haute">Haute</option>
                        </select>
                    </div>

                    <div>
                        <label for="echeance">Échéance</label>
                        <input
                            type="date"
                            id="echeance"
                            name="echeance"
                        >
                    </div>

                    <div>
                        <label for="categorieId">Catégorie</label>
                        <select id="categorieId" name="categorieId">
                            <option value="">Divers (par défaut)</option>
                        </select>
                    </div>

                    <button type="submit" id="submit-button">
                        Ajouter la tâche
                    </button>

                    <button type="button" id="cancel-edit" hidden>
                        Annuler
                    </button>
                </form>
            </section>

            <section id="liste-taches">
                <h2>Mes tâches</h2>

                <nav aria-label="Filtres des tâches">
                    <button type="button" data-filter="toutes">
                        Toutes
                    </button>

                    <button type="button" data-filter="a_faire">
                        À faire
                    </button>

                    <button type="button" data-filter="terminee">
                        Terminées
                    </button>
                </nav>

                <p id="task-count">0</p>

                <div id="task-list" aria-live="polite">
                    <!-- Les tâches seront ajoutées ici par JavaScript. -->
                </div>
            </section>

            <div id="notice" role="status" aria-live="polite"></div>
        </section>
    </main>

    <footer>
        <p>TaskFlow</p>
    </footer>

    <script>
        // Gestion de l'interface TaskFlow

        let filtreActif = "toutes";
        let tacheEnEdition = null;
        let categories = [];

        const formulaire = document.getElementById("task-form");
        const listeTaches = document.getElementById("task-list");
        const compteurTaches = document.getElementById("task-count");
        const message = document.getElementById("notice");

        // Afficher un message à l'utilisateur.
        function afficherMessage(texte, type = "info") {
            message.textContent = texte;
            message.dataset.type = type;
        }

        // Charger les catégories et les tâches enregistrées.
        function initialiserApplication() {
            const resultat = retrouverTaches();

            if (!resultat.succes) {
                document.getElementById("auth-warning").hidden = false;
                return;
            }

            document.getElementById("application").hidden = false;
            categories = resultat.categories || [];

            actualiserCategories();
            afficherTaches();
        }

        // Remplir le menu des catégories.
        function actualiserCategories() {
            const resultat = retrouverTaches();

            if (!resultat.succes) {
                afficherMessage(resultat.erreur, "error");
                return;
            }

            categories = resultat.categories || [];

            const select = document.getElementById("categorieId");
            select.replaceChildren();

            const optionDefaut = document.createElement("option");
            optionDefaut.value = "";
            optionDefaut.textContent = "Divers (par défaut)";
            select.appendChild(optionDefaut);

            categories.forEach(categorie => {
                const option = document.createElement("option");
                option.value = categorie.id;
                option.textContent = categorie.nom;
                select.appendChild(option);
            });
        }

        // Afficher les tâches correspondant au filtre actif.
        function afficherTaches() {
            const resultat = filtrerTaches(filtreActif);

            if (!resultat.succes) {
                afficherMessage(resultat.erreur, "error");
                return;
            }

            listeTaches.replaceChildren();
            compteurTaches.textContent = resultat.taches.length;

            if (resultat.taches.length === 0) {
                const paragraphe = document.createElement("p");
                paragraphe.textContent = resultat.message;
                listeTaches.appendChild(paragraphe);
                return;
            }

            resultat.taches.forEach(tache => {
                const article = document.createElement("article");

                const titre = document.createElement("h3");
                titre.textContent = tache.titre;
                article.appendChild(titre);

                if (tache.description) {
                    const description = document.createElement("p");
                    description.textContent = tache.description;
                    article.appendChild(description);
                }

                const categorie = categories.find(
                    element => element.id === tache.categorieId
                );

                const nomCategorie = document.createElement("p");
                nomCategorie.textContent = "Catégorie : "
                    + (categorie ? categorie.nom : "Divers");
                article.appendChild(nomCategorie);

                if (tache.priorite) {
                    const priorite = document.createElement("p");
                    priorite.textContent = "Priorité : " + tache.priorite;
                    article.appendChild(priorite);
                }

                if (tache.echeance) {
                    const echeance = document.createElement("p");
                    echeance.textContent = "Échéance : " + tache.echeance;
                    article.appendChild(echeance);
                }

                const statut = document.createElement("p");
                statut.textContent = tache.statut === "terminee"
                    ? "Terminée"
                    : "À faire";
                article.appendChild(statut);

                const caseTerminee = document.createElement("input");
                caseTerminee.type = "checkbox";
                caseTerminee.checked = tache.statut === "terminee";
                caseTerminee.setAttribute(
                    "aria-label",
                    "Marquer la tâche comme terminée"
                );

                caseTerminee.addEventListener("change", () => {
                    const resultat = changerStatutTache(
                        tache.id,
                        caseTerminee.checked
                    );

                    if (!resultat.succes) {
                        afficherMessage(resultat.erreur, "error");
                    } else {
                        afficherMessage(resultat.message, "success");
                    }

                    afficherTaches();
                });

                article.appendChild(caseTerminee);

                const boutonModifier = document.createElement("button");
                boutonModifier.type = "button";
                boutonModifier.textContent = "Modifier";

                boutonModifier.addEventListener("click", () => {
                    modifierDepuisFormulaire(tache);
                });

                article.appendChild(boutonModifier);

                const boutonSupprimer = document.createElement("button");
                boutonSupprimer.type = "button";
                boutonSupprimer.textContent = "Supprimer";

                boutonSupprimer.addEventListener("click", () => {
                    const confirmation = window.confirm(
                        "Voulez-vous supprimer la tâche « "
                        + tache.titre + " » ?"
                    );

                    if (!confirmation) {
                        return;
                    }

                    const resultat = supprimerTache(tache.id, true);

                    if (resultat.succes) {
                        afficherMessage(resultat.message, "success");
                        actualiserCategories();
                        afficherTaches();
                    } else {
                        afficherMessage(resultat.erreur, "error");
                    }
                });

                article.appendChild(boutonSupprimer);
                listeTaches.appendChild(article);
            });
        }

        // Préparer le formulaire pour modifier une tâche.
        function modifierDepuisFormulaire(tache) {
            tacheEnEdition = tache.id;

            document.getElementById("titre").value = tache.titre;
            document.getElementById("description").value =
                tache.description || "";
            document.getElementById("priorite").value =
                tache.priorite || "";
            document.getElementById("echeance").value =
                tache.echeance || "";
            document.getElementById("categorieId").value =
                tache.categorieId || "";

            document.getElementById("form-title").textContent =
                "Modifier une tâche";
            document.getElementById("submit-button").textContent =
                "Enregistrer";
            document.getElementById("cancel-edit").hidden = false;
        }

        // Ajouter ou modifier une tâche à la validation du formulaire.
        formulaire.addEventListener("submit", event => {
            event.preventDefault();

            const donnees = {
                titre: document.getElementById("titre").value,
                description: document.getElementById("description").value,
                priorite: document.getElementById("priorite").value,
                echeance: document.getElementById("echeance").value,
                categorieId: document.getElementById("categorieId").value
            };

            let resultat;

            if (tacheEnEdition === null) {
                resultat = ajouterTache(donnees);
            } else {
                resultat = modifierTache(tacheEnEdition, donnees);
            }

            if (!resultat.succes) {
                afficherMessage(resultat.erreur, "error");
                return;
            }

            afficherMessage(resultat.message, "success");
            reinitialiserFormulaire();
            actualiserCategories();
            afficherTaches();
        });

        // Réinitialiser le formulaire après une modification.
        function reinitialiserFormulaire() {
            formulaire.reset();
            tacheEnEdition = null;

            document.getElementById("form-title").textContent =
                "Ajouter une tâche";
            document.getElementById("submit-button").textContent =
                "Ajouter la tâche";
            document.getElementById("cancel-edit").hidden = true;
        }

        document.getElementById("cancel-edit").addEventListener(
            "click",
            reinitialiserFormulaire
        );

        // Changer le filtre affiché.
        document.querySelectorAll("[data-filter]").forEach(bouton => {
            bouton.addEventListener("click", () => {
                filtreActif = bouton.dataset.filter;
                afficherTaches();
            });
        });

        // Lancer l'application au chargement de la page.
        initialiserApplication();
    </script>

</body>
</html>
